<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no" />
<title>Yuung — Cloud Sync</title>
<meta name="theme-color" content="#0b7fa8" id="metaThemeColor">

<style>
    /* CSS VARIABLES */
    :root{
      --bg1: #f0fbff; --bg2: #e6f9ff;
      --card: #ffffff; --muted: #6b8b92; --text: #043242;
      --accent: #ff4757; --accent2: #00a6ff;
      --radius: 16px;
      --shadow: 0 4px 12px rgba(0,0,0,0.08);
    }
    [data-theme="dark"]{
      --bg1: #03181d; --bg2: #07262e;
      --card: #0d1f27; --muted: #9fdff5; --text: #dff8ff;
      --accent: #ff6b87; --accent2: #06b3ff;
      --shadow: 0 10px 30px rgba(0,0,0,0.6);
    }

    /* GLOBAL RESET */
    html,body{height:100%;margin:0;font-family:'Segoe UI', Inter, sans-serif;background:linear-gradient(180deg,var(--bg1),var(--bg2));color:var(--text);overflow-x:hidden;}
    *{box-sizing:border-box; outline:none; -webkit-tap-highlight-color: transparent;}
    
    /* UTILS */
    .wrap{max-width:1100px;margin:0 auto;padding:18px;padding-bottom:120px;}
    .btn{background:var(--card);border:0;padding:10px 14px;border-radius:12px;cursor:pointer;box-shadow:var(--shadow);font-size:14px;color:var(--text);transition:all .2s; user-select: none; display:inline-flex; align-items:center; gap:6px;}
    .btn:hover{transform:translateY(-2px);filter:brightness(1.1);}
    .btn:active{transform:scale(0.96);}
    .btn.primary{background:linear-gradient(90deg,var(--accent),var(--accent2));color:white;font-weight:700;}
    
    /* HEADER */
    header{display:flex;align-items:center;gap:14px;padding:14px;border-radius:var(--radius);background:var(--card);box-shadow:var(--shadow);}
    .logo{width:50px;height:50px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;color:white;font-size:24px;}
    .user-section { margin-left: auto; display:flex; gap: 10px; align-items:center; }
    .avatar {width:32px; height:32px; border-radius:50%; background:#ccc; object-fit:cover; display:none;}

    /* LAYOUT GRID */
    .grid{display:grid;grid-template-columns:360px 1fr;gap:20px;margin-top:20px;}
    @media (max-width:850px){ .grid{grid-template-columns:1fr;} }

    /* CARD & COVER */
    .card{background:var(--card);border-radius:14px;padding:16px;box-shadow:var(--shadow);}
    .cover-container{position:relative; width:100%; height:320px; border-radius:12px; overflow:hidden; box-shadow:0 10px 20px rgba(0,0,0,0.2); background: #000;}
    .cover{width:100%;height:100%;object-fit:cover;background:#222;display:flex;align-items:center;justify-content:center;font-size:40px;color:#fff;}
    
    /* VISUALIZER */
    #visualizer{position: absolute; bottom:0; left:0; width:100%; height:100px; z-index: 2; pointer-events: none; opacity: 0.8;}

    /* URL INPUT GROUP */
    .url-group { display:flex; gap:8px; margin-top:15px; background: var(--card); padding:8px; border-radius:12px; box-shadow: var(--shadow); }
    .url-input { flex:1; border:none; background:transparent; font-size:14px; color:var(--text); padding:0 8px; }

    /* PLAYLIST TRACKS */
    .playlist{display:flex;flex-direction:column;gap:10px; margin-top:10px;}
    .track{display:flex;align-items:center;gap:12px;padding:8px 12px;border-radius:10px;background:var(--card);box-shadow:var(--shadow);transition:0.2s; cursor: pointer;}
    .track:hover{transform:translateX(4px); background:var(--bg2);}
    .track.active{border: 2px solid var(--accent2); background:var(--bg2);}
    .t-cover{width:45px;height:45px;border-radius:8px;object-fit:cover;background:#ddd;flex-shrink:0; display:flex; align-items:center; justify-content:center; font-weight:bold; color:#fff; overflow: hidden;}
    .t-info{flex:1;min-width:0;}
    .t-title{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis; font-size: 15px;}
    .t-sub{font-size:12px;opacity:0.7;}
    
    /* INPUTS */
    input[type=range]{-webkit-appearance:none;width:100%;height:6px;background:rgba(128,128,128,0.3);border-radius:4px;cursor:pointer;}
    input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;background:var(--accent);border-radius:50%;transition:transform .1s;}
    
    /* BOTTOM PLAYER */
    .player-bar{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);width:95%;max-width:1100px;background:rgba(20,20,20,0.95);backdrop-filter:blur(10px);padding:10px 12px;border-radius:16px;display:flex;align-items:center;gap:12px;color:white;z-index:100;box-shadow:0 10px 30px rgba(0,0,0,0.5);}
    [data-theme="light"] .player-bar{background:rgba(255,255,255,0.95);color:#333; border: 1px solid #eee;}
    .bar-cover{width:45px;height:45px;border-radius:8px;object-fit:cover;}
    .bar-info{flex:1;min-width:0;}
    .bar-ctrls{display:flex;gap:8px;}
    @media(max-width:600px){ .bar-time, .hide-mobile{display:none;} .player-bar{bottom:10px; width:96%; padding:10px;} }

    /* LOADER & MODAL */
    #loader{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.8);color:white;display:flex;flex-direction: column;gap: 10px; align-items:center;justify-content:center;z-index:999;font-size:16px;display:none;}
    .spinner {width: 40px;height: 40px;border: 4px solid #f3f3f3;border-top: 4px solid var(--accent);border-radius: 50%;animation: spin 1s linear infinite;}
    @keyframes spin {0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); }}
    
    /* PROGRESS BAR FOR UPLOAD */
    #progressWrap { width: 300px; height: 10px; background: #333; border-radius: 5px; overflow: hidden; display: none; margin-top: 10px;}
    #progressBar { width: 0%; height: 100%; background: var(--accent); transition: width 0.3s; }

</style>
</head>
<body>

<div id="loader">
    <div class="spinner"></div>
    <div id="loaderText">Đang xử lý...</div>
    <div id="progressWrap"><div id="progressBar"></div></div>
</div>

<div class="wrap">
  <header>
    <div class="logo">☁️</div>
    <div style="flex:1">
      <h2 style="margin:0; font-size: 20px;">Yuung V3.0</h2>
      <div style="font-size:12px;opacity:0.7">Cloud Sync & Download</div>
    </div>
    
    <div class="user-section">
        <img id="userAvatar" class="avatar">
        <button id="loginBtn" class="btn primary">🔑 Đăng nhập</button>
        <button id="syncBtn" class="btn" style="display:none">🔄 Đồng bộ</button>
        <button id="logoutBtn" class="btn" style="display:none">🚪</button>
        <button class="btn" onclick="toggleTheme()">🌓</button>
    </div>
  </header>

  <div class="url-group">
      <input id="urlInput" class="url-input" placeholder="Dán link YouTube/Spotify vào đây (Cần API)...">
      <button class="btn primary" onclick="processUrl()">⬇️ Tải về</button>
  </div>

  <div style="display:flex; flex-wrap:wrap; gap:10px; margin-top:15px">
    <label class="btn">
        ➕ File Máy
        <input type="file" id="fileInput" accept="audio/*" multiple hidden>
    </label>
    <button class="btn" id="zipExportBtn">📦 Backup Zip</button>

  <div class="grid">
    <div>
      <div class="card">
        <div class="cover-container">
           <div id="mainCover" class="cover">🎧</div>
           <canvas id="visualizer" width="360" height="100"></canvas>
        </div>

        <div style="display:flex; justify-content:center; gap:10px; margin-top:10px">
             <input type="checkbox" id="vizToggle" checked onchange="toggleVisualizer(this.checked)">
             <label for="vizToggle" style="font-size:12px">Sóng Nhạc</label>
        </div>

        <div style="text-align:center; margin-top:10px;">
           <h3 id="nowTitle" style="margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:18px;">—</h3>
           <div id="nowArtist" style="font-size:13px;opacity:0.7;margin-top:4px">Chưa phát nhạc</div>
        </div>

        <div style="margin-top:15px; display:flex; align-items:center; gap:10px">
           <span id="currentTime" style="font-size:12px;width:35px; text-align:right">0:00</span>
           <input id="seek" type="range" min="0" max="100" value="0">
           <span id="duration" style="font-size:12px;width:35px">0:00</span>
        </div>

        <div style="display:flex; justify-content:center; align-items:center; gap:20px; margin-top:20px">
           <button class="btn" id="prevBtn">⏮</button>
           <button class="btn primary" id="playBtn" style="width:60px; height:60px; font-size:24px; border-radius:50%; justify-content:center">▶️</button>
           <button class="btn" id="nextBtn">⏭</button>
        </div>
        
        <div style="display:flex; justify-content:space-between; margin-top:20px">
            <button class="btn" id="shuffleBtn">🔀 Off</button>
            <button class="btn" id="repeatBtn">🔁 Off</button>
            <button class="btn" onclick="clearAllData()" style="color:var(--accent)">🗑️ Xóa hết</button>
        </div>
      </div>
      
      <div class="card" style="margin-top:20px">
          <b>Trạng thái:</b> <span id="storageStatus">Checking...</span>
      </div>
    </div>

    <div class="card" style="height:fit-content">
       <input id="searchInput" placeholder="🔍 Tìm bài hát..." style="width:100%; padding:10px; border-radius:8px; border:1px solid #ccc; background:transparent; color:var(--text); margin-bottom:10px">
       <div id="playlist" class="playlist"></div>
    </div>
  </div>
</div>

<div class="player-bar" id="playerBar" style="display:none">
   <div id="barCover" class="bar-cover" style="background:#777; display:flex; align-items:center; justify-content:center">🎵</div>
   <div class="bar-info">
      <div id="barTitle" style="font-weight:bold; font-size: 14px;">Title</div>
      <div id="barArtist" style="font-size:11px;">Yuung Player</div>
   </div>
   <div class="bar-ctrls">
      <button class="btn" id="barPrev">⏮</button>
      <button class="btn primary" id="barPlay">▶️</button>
      <button class="btn" id="barNext">⏭</button>
   </div>
</div>

<script>
/* =========================================
   1. FIREBASE CONFIGURATION (BẠN PHẢI THAY ĐỔI PHẦN NÀY)
   ========================================= */
// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyDuG8bN_OXGn5Fhjf4DxRTvKABPH1MjaCM",
  authDomain: "yuung-ddef4.firebaseapp.com",
  projectId: "yuung-ddef4",
  storageBucket: "yuung-ddef4.firebasestorage.app",
  messagingSenderId: "576192842780",
  appId: "1:576192842780:web:2fbd4e17c56bdfb0e1e3d9",
  measurementId: "G-NQ7S0GKVTJ"
};

// Khởi tạo Firebase nếu có Config
let auth, db, storage;
let currentUser = null;
try {
    if(firebaseConfig.apiKey !== "YOUR_API_KEY_HERE") {
        firebase.initializeApp(firebaseConfig);
        auth = firebase.auth();
        db = firebase.firestore();
        storage = firebase.storage();
        console.log("Firebase Connected");
    } else {
        console.warn("Chưa cấu hình Firebase! Tính năng Cloud sẽ không hoạt động.");
    }
} catch(e){ console.error(e); }

/* =========================================
   2. CORE VARIABLES & INDEXED DB
   ========================================= */
const DB_NAME = 'yuung_db_v3';
const DB_STORE = 'files';
const META_KEY = 'yuung_meta_v3';

let tracks = [];
let queue = [];
let audio = new Audio();
let currentIndex = -1;
let isShuffle = false;
let repeatMode = 0;
let currentBlobUrl = null;

// --- INDEXED DB ---
const dbPromise = new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = e => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains(DB_STORE)) db.createObjectStore(DB_STORE, { keyPath: 'id' });
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
});

async function saveFileDB(id, blob) {
    const db = await dbPromise;
    return new Promise((res, rej) => {
        const tx = db.transaction(DB_STORE, 'readwrite');
        tx.objectStore(DB_STORE).put({ id, blob });
        tx.oncomplete = () => res();
        tx.onerror = (e) => rej(e);
    });
}

async function getFileDB(id) {
    try {
        const db = await dbPromise;
        return new Promise((res) => {
            const tx = db.transaction(DB_STORE, 'readonly');
            const req = tx.objectStore(DB_STORE).get(id);
            req.onsuccess = () => res(req.result ? req.result.blob : null);
            req.onerror = () => res(null);
        });
    } catch(e) { return null; }
}

async function deleteFileDB(id) {
    const db = await dbPromise;
    const tx = db.transaction(DB_STORE, 'readwrite');
    tx.objectStore(DB_STORE).delete(id);
}

async function clearDB() {
    const db = await dbPromise;
    const tx = db.transaction(DB_STORE, 'readwrite');
    tx.objectStore(DB_STORE).clear();
}

// --- HELPER FUNC ---
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2); }

function saveMeta() {
    localStorage.setItem(META_KEY, JSON.stringify(tracks));
    renderPlaylist();
    document.getElementById('storageStatus').innerText = `Local: ${tracks.length} bài. Cloud: ${currentUser ? 'Ready' : 'Login required'}`;
}

function loadMeta() {
    const raw = localStorage.getItem(META_KEY);
    if (raw) {
        tracks = JSON.parse(raw);
        queue = tracks.map(t => t.id);
        renderPlaylist();
    }
}

// =========================================
// 3. URL DOWNLOADER (Cần API)
// =========================================
async function processUrl() {
    const url = document.getElementById('urlInput').value.trim();
    if(!url) return alert("Vui lòng nhập link!");

    showLoader(true, "Đang kết nối Server...");

    // -----------------------------------------------------------
    // LƯU Ý: Đây là đoạn code giả lập. Bạn cần thay thế fetch bên dưới
    // bằng API Server của bạn (Vd: Nodejs server dùng ytdl-core)
    // -----------------------------------------------------------
    try {
        // Ví dụ: const res = await fetch('https://YOUR-API.com/download?url=' + url);
        // const blob = await res.blob();
        
        // MÔ PHỎNG LỖI VÌ KHÔNG CÓ API THẬT
        throw new Error("Chưa cấu hình API Server! Trình duyệt không thể tự tải YouTube/Spotify do chặn CORS. Bạn cần backend để làm điều này.");
        
        /* NẾU CÓ API, CODE SẼ CHẠY NHƯ SAU:
        const id = uid();
        await saveFileDB(id, blob); // Lưu vào DB
        tracks.push({ id, name: "Downloaded Song", type: blob.type, size: blob.size, cover: null });
        saveMeta();
        alert("Tải thành công!");
        */
    } catch (e) {
        alert("Lỗi: " + e.message);
    } finally {
        showLoader(false);
    }
}

// =========================================
// 4. CLOUD SYNC & AUTH (Logic cốt lõi)
// =========================================

// --- AUTH HANDLE ---
document.getElementById('loginBtn').onclick = () => {
    if(!auth) return alert("Chưa cấu hình Firebase Config trong code!");
    const provider = new firebase.auth.GoogleAuthProvider();
    auth.signInWithPopup(provider).catch(e => alert(e.message));
};

document.getElementById('logoutBtn').onclick = () => auth.signOut();

if(auth) {
    auth.onAuthStateChanged(user => {
        currentUser = user;
        const loginBtn = document.getElementById('loginBtn');
        const syncBtn = document.getElementById('syncBtn');
        const logoutBtn = document.getElementById('logoutBtn');
        const avatar = document.getElementById('userAvatar');

        if(user) {
            loginBtn.style.display = 'none';
            syncBtn.style.display = 'inline-flex';
            logoutBtn.style.display = 'inline-flex';
            avatar.style.display = 'block';
            avatar.src = user.photoURL;
            document.getElementById('storageStatus').innerText = `Hi, ${user.displayName}`;
        } else {
            loginBtn.style.display = 'inline-flex';
            syncBtn.style.display = 'none';
            logoutBtn.style.display = 'none';
            avatar.style.display = 'none';
        }
    });
}

// --- SYNC HANDLE (Backup & Restore) ---
document.getElementById('syncBtn').onclick = async () => {
    if(!currentUser) return;
    const choice = confirm("Chọn 'OK' để TẢI NHẠC TỪ CLOUD VỀ MÁY (Restore).\nChọn 'Cancel' để UP NHẠC TỪ MÁY LÊN CLOUD (Backup).");
    
    if(choice) {
        // RESTORE: Cloud -> Local
        await restoreFromCloud();
    } else {
        // BACKUP: Local -> Cloud
        await backupToCloud();
    }
};

async function backupToCloud() {
    if(tracks.length === 0) return alert("Không có nhạc để backup!");
    showLoader(true, "Đang chuẩn bị upload...");
    
    const userRef = db.collection('users').doc(currentUser.uid);
    const storageRef = storage.ref().child(`users/${currentUser.uid}`);
    
    // 1. Upload Meta
    await userRef.set({ tracks: tracks });
    
    // 2. Upload Files
    let uploaded = 0;
    const total = tracks.length;
    
    document.getElementById('progressWrap').style.display = 'block';
    
    for(const t of tracks) {
        const blob = await getFileDB(t.id);
        if(blob) {
            const fileRef = storageRef.child(t.id);
            // Check if exists to save bandwidth? (Skipped for simplicity)
            await fileRef.put(blob);
        }
        uploaded++;
        const pct = (uploaded/total)*100;
        document.getElementById('progressBar').style.width = pct + '%';
        document.getElementById('loaderText').innerText = `Đang upload: ${uploaded}/${total}`;
    }
    
    showLoader(false);
    alert("Backup hoàn tất!");
}

async function restoreFromCloud() {
    showLoader(true, "Đang lấy dữ liệu Cloud...");
    
    try {
        // 1. Get Meta
        const doc = await db.collection('users').doc(currentUser.uid).get();
        if(!doc.exists) throw new Error("Không tìm thấy dữ liệu trên Cloud!");
        
        const cloudTracks = doc.data().tracks || [];
        const storageRef = storage.ref().child(`users/${currentUser.uid}`);
        
        document.getElementById('progressWrap').style.display = 'block';
        let count = 0;
        
        // 2. Download Files
        for(const t of cloudTracks) {
            // Check if already in local
            const existing = await getFileDB(t.id);
            if(!existing) {
                const url = await storageRef.child(t.id).getDownloadURL();
                const res = await fetch(url);
                const blob = await res.blob();
                await saveFileDB(t.id, blob);
            }
            count++;
            const pct = (count/cloudTracks.length)*100;
            document.getElementById('progressBar').style.width = pct + '%';
            document.getElementById('loaderText').innerText = `Đang tải về: ${count}/${cloudTracks.length}`;
        }
        
        // Merge list
        tracks = cloudTracks;
        saveMeta();
        location.reload();
        
    } catch(e) {
        alert("Lỗi Restore: " + e.message);
    } finally {
        showLoader(false);
    }
}

// =========================================
// 5. BASIC AUDIO LOGIC
// =========================================
// (Giữ nguyên logic AudioContext và xử lý file từ phiên bản trước)
let audioCtx, analyser, dataArray, sourceNode;
let isVizOn = true; let animationId = null;

function initAudioSystem() {
    if(!audioCtx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AC();
    }
    if(audioCtx.state === 'suspended') audioCtx.resume();
    if(!analyser) {
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 64;
        dataArray = new Uint8Array(analyser.frequencyBinCount);
    }
    if(!sourceNode) {
        try {
            sourceNode = audioCtx.createMediaElementSource(audio);
            sourceNode.connect(analyser);
            analyser.connect(audioCtx.destination);
        } catch(e){}
    }
}

function toggleVisualizer(isOn) { isVizOn = isOn; if(isOn && !audio.paused) drawVisualizer(); }
function drawVisualizer() {
    if(!isVizOn || audio.paused) return;
    animationId = requestAnimationFrame(drawVisualizer);
    analyser.getByteFrequencyData(dataArray);
    const canvas = document.getElementById('visualizer');
    const ctx = canvas.getContext('2d');
    const w = canvas.width; const h = canvas.height;
    ctx.clearRect(0, 0, w, h);
    const barWidth = (w / dataArray.length) * 2; 
    let x = 0;
    for(let i = 0; i < dataArray.length; i++) {
        const v = dataArray[i]; 
        const barHeight = (v / 255) * h;
        ctx.fillStyle = `rgba(${v + 50}, 150, 255, 0.8)`; 
        ctx.fillRect(x, h - barHeight, barWidth - 1, barHeight);
        x += barWidth;
    }
}

// Playback Control
async function playTrack(id) {
    try { initAudioSystem(); } catch(e){}
    const track = tracks.find(t => t.id === id);
    if (!track) return;

    if (currentBlobUrl) URL.revokeObjectURL(currentBlobUrl);
    let blob = await getFileDB(id);
    if (!blob) return alert('File lỗi hoặc chưa tải xong!');

    currentBlobUrl = URL.createObjectURL(blob);
    currentIndex = queue.indexOf(id);
    audio.src = currentBlobUrl;
    
    audio.play().then(() => {
        if(isVizOn) drawVisualizer();
        updateUI(true);
    }).catch(e => console.error(e));

    // Update Meta UI
    document.getElementById('nowTitle').innerText = track.name;
    document.getElementById('barTitle').innerText = track.name;
    const coverHtml = track.cover ? `<img src="${track.cover}" style="width:100%;height:100%;object-fit:cover">` : '🎵';
    document.getElementById('mainCover').innerHTML = track.cover ? `<img src="${track.cover}" style="width:100%;height:100%;object-fit:cover">` : `<div style="font-size:40px; color:#555">🎵</div>`;
    document.getElementById('barCover').innerHTML = coverHtml;
    
    document.getElementById('playerBar').style.display = 'flex';
    renderPlaylist();
    
    if ('mediaSession' in navigator) {
        navigator.mediaSession.metadata = new MediaMetadata({
            title: track.name, artist: 'Yuung Player',
            artwork: track.cover ? [{ src: track.cover, sizes: '512x512', type: 'image/jpeg' }] : []
        });
    }
}

function updateUI(isPlaying) {
    const txt = isPlaying ? '⏸' : '▶️';
    document.getElementById('playBtn').innerText = txt;
    document.getElementById('barPlay').innerText = txt;
}

// Basic Events
document.getElementById('playBtn').onclick = () => audio.paused ? audio.play().then(()=>updateUI(true)) : (audio.pause(), updateUI(false));
document.getElementById('barPlay').onclick = document.getElementById('playBtn').onclick;

document.getElementById('nextBtn').onclick = () => {
    if(queue.length === 0) return;
    let nextIdx = isShuffle ? Math.floor(Math.random() * queue.length) : currentIndex + 1;
    if(nextIdx >= queue.length) nextIdx = 0;
    playTrack(queue[nextIdx]);
};
document.getElementById('barNext').onclick = document.getElementById('nextBtn').onclick;

document.getElementById('prevBtn').onclick = () => {
    if(queue.length === 0) return;
    let prevIdx = currentIndex - 1;
    if(prevIdx < 0) prevIdx = queue.length - 1;
    playTrack(queue[prevIdx]);
};
document.getElementById('barPrev').onclick = document.getElementById('prevBtn').onclick;

audio.addEventListener('timeupdate', () => {
    if(!audio.duration) return;
    document.getElementById('seek').value = (audio.currentTime / audio.duration) * 100;
    const fmt = s => { const m=Math.floor(s/60),sec=Math.floor(s%60); return `${m}:${sec<10?'0':''}${sec}`; };
    document.getElementById('currentTime').innerText = fmt(audio.currentTime);
    document.getElementById('duration').innerText = fmt(audio.duration);
});
document.getElementById('seek').oninput = e => audio.currentTime = (e.target.value/100)*audio.duration;
audio.addEventListener('ended', () => document.getElementById('nextBtn').click());

// File Inputs
document.getElementById('fileInput').onchange = async e => {
    showLoader(true);
    for(const file of e.target.files) {
        const id = uid();
        let cover = null;
        // Basic Tag Reading (Simplified)
        if(window.jsmediatags) {
            try {
                cover = await new Promise(r => jsmediatags.read(file, { onSuccess: t => {
                    const p = t.tags.picture; 
                    if(p) {
                        let b=""; for(let i=0;i<p.data.length;i++) b+=String.fromCharCode(p.data[i]);
                        r("data:"+p.format+";base64,"+btoa(b));
                    } else r(null);
                }, onError: ()=>r(null) }));
            } catch(e){}
        }
        await saveFileDB(id, file);
        tracks.push({id, name: file.name.replace(/\.[^/.]+$/, ""), size: file.size, cover});
        queue.push(id);
    }
    saveMeta(); showLoader(false);
};

async function clearAllData() {
    if(!confirm('Xóa toàn bộ dữ liệu máy? (Cloud vẫn giữ nếu đã sync)')) return;
    await clearDB(); localStorage.removeItem(META_KEY); location.reload();
}

function renderPlaylist() {
    const list = document.getElementById('playlist');
    const term = document.getElementById('searchInput').value.toLowerCase();
    list.innerHTML = '';
    tracks.forEach(t => {
        if(term && !t.name.toLowerCase().includes(term)) return;
        const div = document.createElement('div');
        div.className = `track ${t.id === queue[currentIndex] ? 'active' : ''}`;
        div.innerHTML = `
            <div class="t-cover">${t.cover ? `<img src="${t.cover}" style="width:100%">` : '🎵'}</div>
            <div class="t-info"><div class="t-title">${t.name}</div><div class="t-sub">${(t.size/1e6).toFixed(1)}MB</div></div>
            <button class="btn" onclick="event.stopPropagation(); deleteTrack('${t.id}')">✕</button>
        `;
        div.onclick = () => playTrack(t.id);
        list.appendChild(div);
    });
}
async function deleteTrack(id) {
    if(!confirm('Xóa?')) return;
    await deleteFileDB(id); tracks = tracks.filter(t=>t.id!==id); queue=tracks.map(t=>t.id); saveMeta();
}
document.getElementById('searchInput').oninput = renderPlaylist;

// UI Helpers
function showLoader(show, txt="Đang xử lý...") {
    document.getElementById('loader').style.display = show ? 'flex' : 'none';
    document.getElementById('loaderText').innerText = txt;
    if(!show) document.getElementById('progressWrap').style.display='none';
}
function toggleTheme() {
    const html = document.documentElement;
    const isDark = html.getAttribute('data-theme') === 'dark';
    html.setAttribute('data-theme', isDark ? 'light' : 'dark');
}

// Init
loadMeta();
</script>
</body>
</html>
